<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project Details">
    <title>Project Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Gribouillis décoratifs — fixés au fond de la page, ils se baladent même au scroll -->

        <svg class="doodle d3" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M4 32 Q 16 8 34 13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M27 8 L35 13 L29 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="doodle d4" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 4 V36 M4 20 H36 M9 9 L31 31 M31 9 L9 31" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <svg class="doodle d5" viewBox="0 0 44 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 16 q4 -10 8 0 t8 0 t8 0 t8 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <svg class="doodle d6" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M23 4 L11 21 L18 21 L15 36 L29 17 L21 17 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <svg class="doodle d7" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M11 15 h18 a6 6 0 0 1 6 6 v2 a4.5 4.5 0 0 1 -8.2 2.5 L24 22.5 h-8 l-2.8 3 A4.5 4.5 0 0 1 5 23 v-2 a6 6 0 0 1 6 -6 Z M14 18.5 v5 M11.5 21 h5 M26.5 19.5 h.01 M29.5 22.5 h.01" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="doodle d8" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="17" cy="31" r="3.8" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20.8 31 V8 q 9 2 9 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>

    <!-- Header with Navigation -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#project-hero">Overview</a></li>
                <li><a href="#technical-details">Technical Details</a></li>
                <li><a href="#team">Team</a></li>
            </ul>
        </nav>
        <h1 id="proj-title">Loading…</h1>
        <p id="proj-subtitle"></p>
    </header>

    <!-- HERO façon Steam : média (vidéo/screenshot) à gauche, colonne info à droite
         (capsule + description + tags + boutons jouer) — rempli par JS -->
    <section id="project-hero" class="steam-hero">
        <div class="hero-media" id="proj-media"></div>
        <aside class="hero-side">
            <div class="hero-capsule" id="proj-capsule"></div>
            <!-- Badges catégorie (Perso/Scolaire) + Game Jam -->
            <div id="proj-meta" class="proj-meta"></div>
            <p id="proj-overview" class="hero-overview"></p>
            <!-- Tags techno du projet -->
            <div id="proj-tags" class="hero-tags"></div>
            <!-- Boutons "jouer" : itch.io / Steam (si renseignés) -->
            <div id="proj-links" class="proj-links"></div>
        </aside>
    </section>

    <!-- Technical Details Section -->
    <section id="technical-details" hidden>
        <h2>Technical Details</h2>
        <div id="proj-features"></div>
    </section>

    <!-- Team & Credits Section (masquée si pas de crédits) -->
    <section id="team" hidden>
        <h2>Team &amp; Credits</h2>
        <div class="credits-list" id="proj-credits"></div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Elias OSBORN SALINAS - All rights reserved</p>
    </footer>

    <script type="module" src="js/project-page.js"></script>
</body>
</html>
